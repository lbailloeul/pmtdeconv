name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # Goldens are blessed per checkout (byte-identity depends on the numpy
      # build), so here they guard determinism, not drift from a past commit.
      - run: python tests/fixtures/bless_goldens.py
      - run: python -m pytest tests/
